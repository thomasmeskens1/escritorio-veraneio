<div class="palco capa">
  <img class="foto" src="foto" style="object-position: $foco" alt="">
  <div class="degrade degrade-topo"></div>
  <div class="degrade degrade-base"></div>
  <header class="capa-topo">
    <p class="kicker">$kicker</p>
    <h1 class="titulo">$titulo</h1>
    <p class="subtitulo">$subtitulo</p>
    $contagem
  </header>
  <footer class="capa-base">
    <div class="selo">
      <p class="selo-lodge">$lodge</p>
      <p class="selo-local">$local</p>
      <p class="selo-dados">$dados</p>
    </div>
    <img class="logo" src="$logo" alt="Casa Veraneio">
  </footer>
</div>
