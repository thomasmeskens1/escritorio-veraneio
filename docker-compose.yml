# Produção: `docker compose up -d` (volta sozinho com o Docker Desktop; só o próprio PC acessa a porta,
# o público chega pelo túnel). Desenvolvimento com recarga automática:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
services:
  api:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000" # só o PC (túnel e Trabalhador Max); ninguém da rede acessa direto
    env_file: .env
    environment:
      FRONTEND_DIR: /frontend
      ARQUIVO_BANCO: /var/lib/escritorio/escritorio.db # banco no volume (rápido); o resto de dados/ segue no PC
      CREWAI_TELEMETRY_OPT_OUT: "true"
      TZ: America/Sao_Paulo # datas "de hoje" certas entre 21h e 0h (revisão de 30/10/2026)
      PAINEL_DIR: /painel
      SOCIAL_ANALYTICS_DADOS: /painel
      SISTEMA_DIR: /sistema
      OTEL_SDK_DISABLED: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway" # acesso ao Ollama rodando no host
    volumes:
      - ./backend:/app
      - ./frontend:/frontend:ro
      - banco:/var/lib/escritorio
      # Painel analítico (Sistema Casa Veraneio), só leitura e só o necessário (revisão de 30/10/2026: antes a pasta
      # inteira entrava, com os logins do Google, cópias antigas do .env e a sessão do WhatsApp):
      # banco das métricas e o .env (chave do Brevo e as contas de anúncio que o coleta/config.py lê).
      - ${LOCALAPPDATA:-./backend/dados}/SocialAnalytics/analytics.db:/painel/analytics.db:ro
      - ${LOCALAPPDATA:-./backend/dados}/SocialAnalytics/.env:/painel/.env:ro
      # Código das análises (db_manager.ler_*) que o Analista de Métricas usa.
      - ${SOCIAL_ANALYTICS_DIR:-../social-analytics}/db_manager.py:/sistema/db_manager.py:ro
      - ${SOCIAL_ANALYTICS_DIR:-../social-analytics}/caminhos.py:/sistema/caminhos.py:ro
      - ${SOCIAL_ANALYTICS_DIR:-../social-analytics}/painel_dados.py:/sistema/painel_dados.py:ro
      - ${SOCIAL_ANALYTICS_DIR:-../social-analytics}/coleta:/sistema/coleta:ro
    # Um processo só (estado dos agentes e WebSockets em memória). Atrás do túnel, o IP real do visitante
    # vem nos cabeçalhos X-Forwarded-* (bloqueio de login por IP).
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips "*"
    # Revisão de 30/10/2026 (2.29): o Docker marca o contêiner como "unhealthy" se o banco parar de responder.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/saude', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Logs do contêiner com tamanho limitado (antes cresciam sem limite no disco do Docker).
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  banco: # SQLite fora da pasta compartilhada do Windows; cópia a cada 1 h e ao desligar em backend/dados
