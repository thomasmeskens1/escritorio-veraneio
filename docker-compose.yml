# Produção: `docker compose up -d` (volta sozinho com o Docker Desktop; só o próprio PC acessa a porta,
# o público chega pelo túnel). Desenvolvimento com recarga automática:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
services:
  api:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000" # só o PC (túnel e Trabalhador Max); ninguém da rede acessa direto
    env_file: .env
    environment:
      FRONTEND_DIR: /frontend
      ARQUIVO_BANCO: /var/lib/escritorio/escritorio.db # banco no volume (rápido); o resto de dados/ segue no PC
      CREWAI_TELEMETRY_OPT_OUT: "true"
      PAINEL_DIR: /painel
      SOCIAL_ANALYTICS_DADOS: /painel
      SISTEMA_DIR: /sistema
      OTEL_SDK_DISABLED: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway" # acesso ao Ollama rodando no host
    volumes:
      - ./backend:/app
      - ./frontend:/frontend:ro
      - banco:/var/lib/escritorio
      # painel analítico (Sistema Casa Veraneio), só leitura: chave do Brevo para os rascunhos do E-mail Marketing
      - ${LOCALAPPDATA:-./backend/dados}/SocialAnalytics:/painel:ro
      # código do painel (só leitura): o Analista de Métricas usa as mesmas análises dele (db_manager.ler_*)
      - ${SOCIAL_ANALYTICS_DIR:-../social-analytics}:/sistema:ro
    # Um processo só (estado dos agentes e WebSockets em memória). Atrás do túnel, o IP real do visitante
    # vem nos cabeçalhos X-Forwarded-* (bloqueio de login por IP).
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips "*"

volumes:
  banco: # SQLite fora da pasta compartilhada do Windows; cópia a cada 6 h em backend/dados para o backup
