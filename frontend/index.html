<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escritório Veraneio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233a3026'/%3E%3Ctext x='16' y='23' font-family='sans-serif' font-size='19' font-weight='700' text-anchor='middle' fill='%23f4a261'%3EV%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="chat.css">
  <link rel="stylesheet" href="painel.css">
  <link rel="stylesheet" href="aprendizado.css">
  <link rel="stylesheet" href="topo.css">
  <link rel="stylesheet" href="perfil.css">
  <link rel="stylesheet" href="registro.css">
  <link rel="stylesheet" href="onboarding.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
</head>
<body>
  <!-- Tela de login (visível até existir uma sessão válida) -->
  <main id="login" class="login">
    <form id="login-form" class="login-cartao" novalidate>
      <div class="login-marca">
        <span class="login-logo">V</span>
        <div>
          <h1>Escritório Veraneio</h1>
          <p>Acesso restrito a colaboradores</p>
        </div>
      </div>

      <label class="campo">
        <span>E-mail ou usuário</span>
        <input id="login-usuario" name="usuario" autocomplete="username" required>
      </label>
      <label class="campo">
        <span>Senha</span>
        <input id="login-senha" name="senha" type="password" autocomplete="current-password" required>
      </label>

      <p id="login-erro" class="login-erro" role="alert"></p>
      <button id="login-entrar" class="botao-primario" type="submit">Entrar</button>
    </form>
  </main>

  <!-- Escritório (exibido após o login) -->
  <div id="app" hidden>
    <div id="jogo"></div>

    <!-- Barra superior: andar, contadores de agentes, registro, sessão e relógio -->
    <header id="topo" class="topo">
      <div class="topo-marca">
        <span class="topo-logo" aria-hidden="true">V</span>
        <div class="topo-titulo">
          <h1>Escritório <span>Veraneio</span></h1>
          <p id="andar-atual"></p>
        </div>
      </div>

      <ul class="contadores" aria-label="Agentes por status">
        <li class="contador contador-disponivel" title="Agentes disponíveis">
          <strong id="contador-disponivel">0</strong><span>Disponíveis</span>
        </li>
        <li class="contador contador-trabalhando" title="Agentes trabalhando">
          <strong id="contador-trabalhando">0</strong><span>Trabalhando</span>
        </li>
        <li class="contador contador-construindo" title="Agentes em construção">
          <strong id="contador-construindo">0</strong><span>Em construção</span>
        </li>
        <li class="contador contador-dormindo" title="Agentes pausados">
          <strong id="contador-dormindo">0</strong><span>Pausados</span>
        </li>
      </ul>

      <div class="topo-acoes">
        <button id="abrir-registro" class="topo-icone" type="button" aria-label="Registro de atividade" title="Registro de atividade">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>
          </svg>
        </button>
        <div class="topo-sessao">
          <span id="usuario-logado"></span>
          <button id="sair" class="sair" type="button">Sair</button>
        </div>
        <span id="conexao" class="conexao" role="status" title="Servidor desconectado">FECHADO</span>
        <time id="relogio" class="relogio"></time>
      </div>
    </header>

    <nav id="elevador" aria-label="Elevador">
      <h2>Elevador</h2>
      <button class="andar bloqueado" data-andar="cobertura" data-icone="C" title="Acesso restrito à diretoria">
        <span class="icone">🔒</span> Cobertura
      </button>
      <button class="andar" data-andar="marketing">
        <span class="icone">1</span> Marketing
      </button>
      <button class="andar" data-andar="terreo">
        <span class="icone">T</span> Térreo
      </button>
      <button class="andar" data-andar="porao">
        <span class="icone">P</span> Porão
      </button>
    </nav>

    <!-- Janela do agente: informações + conversa -->
    <div id="modal" class="modal">
      <section class="janela janela-agente" role="dialog" aria-modal="true" aria-labelledby="modal-nome">
        <header class="janela-barra">
          <span class="janela-luzes" aria-hidden="true"><i></i><i></i><i></i></span>
          <span id="modal-status" class="status"></span>
          <div class="janela-titulo">
            <h2 id="modal-nome"></h2>
            <p id="modal-funcao"></p>
          </div>
          <button id="modal-fechar" class="fechar" type="button" aria-label="Fechar">×</button>
        </header>

        <!-- Só no popup da Recepcionista: convite para o tutorial (js/onboarding.js) -->
        <div id="modal-onboarding" class="onboarding-chamada" hidden>
          <p>Primeira vez por aqui? Venha comigo num tour rápido pelo sistema.</p>
          <button id="iniciar-onboarding" type="button" class="botao-primario">Iniciar Onboarding</button>
        </div>
        <section id="modal-perfil" class="perfil" aria-label="Sobre o agente"></section>
        <p id="modal-restrito" class="aviso-restrito" role="note" hidden></p>
        <!-- Andamento da tarefa ativa (js/andamento.js): aparece ao lado da conversa enquanto o agente trabalha -->
        <aside id="modal-andamento" class="andamento" aria-label="Andamento da tarefa" aria-live="polite" hidden></aside>

        <div id="modal-historico" class="historico" aria-live="polite"></div>
        <p id="modal-pensando" class="pensando" hidden>pensando<span>...</span></p>

        <form id="modal-form" class="janela-rodape">
          <div id="modal-anexos" class="anexos-chips" aria-label="Arquivos anexados" hidden></div>
          <p id="modal-anexos-aviso" class="anexos-aviso" role="alert" hidden></p>
          <div id="modal-progresso" class="anexos-progresso" role="progressbar" aria-label="Envio dos anexos"
            aria-valuemin="0" aria-valuemax="100" hidden><span></span></div>
          <input id="modal-arquivo" type="file" accept="image/png,image/jpeg,image/webp,application/pdf" multiple hidden>
          <button id="modal-anexar" class="botao-anexar" type="button" aria-label="Anexar imagem ou PDF"
            title="Anexar imagem ou PDF (até 4 arquivos, 15 MB cada)">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              d="M21 11.5 12.6 19.9a5.5 5.5 0 0 1-7.8-7.8l8.5-8.5a3.7 3.7 0 0 1 5.2 5.2l-8.5 8.5a1.8 1.8 0 0 1-2.6-2.6l7.8-7.8"/></svg>
          </button>
          <textarea id="modal-input" rows="1" autocomplete="off" placeholder="Descreva a tarefa..."
            aria-label="Tarefa (Enter envia, Shift+Enter pula linha)"></textarea>
          <button id="modal-enviar" class="botao-primario" type="submit">Enviar Tarefa</button>
        </form>
      </section>
    </div>

    <!-- Registro de atividade -->
    <div id="registro" class="modal">
      <section class="janela janela-painel" role="dialog" aria-modal="true" aria-labelledby="registro-titulo">
        <header class="janela-barra">
          <span class="janela-luzes" aria-hidden="true"><i></i><i></i><i></i></span>
          <div class="janela-titulo">
            <h2 id="registro-titulo">Registro de atividade</h2>
            <p id="registro-atualizado"></p>
          </div>
          <button id="registro-fechar" class="fechar" type="button" aria-label="Fechar">×</button>
        </header>
        <div id="registro-conteudo" class="registro-conteudo"></div>
      </section>
    </div>

    <!-- Painel de tarefas do Despachante -->
    <div id="painel" class="modal">
      <section class="janela janela-painel" role="dialog" aria-modal="true" aria-labelledby="painel-titulo">
        <header class="janela-barra">
          <span class="janela-luzes" aria-hidden="true"><i></i><i></i><i></i></span>
          <div class="janela-titulo">
            <h2 id="painel-titulo">Despachante · Fila de tarefas</h2>
            <p id="painel-atualizado"></p>
          </div>
          <button id="painel-fechar" class="fechar" type="button" aria-label="Fechar">×</button>
        </header>
        <div id="painel-conteudo" class="painel-conteudo"></div>
      </section>
    </div>

    <!-- Notificações de novas respostas -->
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  </div>

  <script src="js/cenario/iso.js"></script>
  <script src="js/cenario/avatar_partes.js"></script>
  <script src="js/cenario/avatar.js"></script>
  <script src="js/cenario/paredes.js"></script>
  <script src="js/cenario/moveis.js"></script>
  <script src="js/cenario/estacoes.js"></script>
  <script src="js/cenario/decoracao.js"></script>
  <script src="js/cenario/cenarios_setores.js"></script>
  <script src="js/cenario/estacoes_setores.js"></script>
  <script src="js/cenario/setores.js"></script>
  <script src="js/cenario/cerebro.js"></script>
  <script src="js/cenario/laboratorio.js"></script>
  <script src="js/escritorio.js"></script>
  <script src="js/destaque_setor.js"></script>
  <script src="js/visitas.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/painel.js"></script>
  <script src="js/aprendizado.js"></script>
  <script src="js/perfil.js"></script>
  <script src="js/andamento.js"></script>
  <script src="js/registro.js"></script>
  <script src="js/onboarding.js"></script>
  <script src="js/topo.js"></script>
  <script src="js/rede.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
